<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信用评级招标公告日报 - 历史报告导航</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1a365d 0%, #2c5282 50%, #3182ce 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1a3a6b 0%, #2c5282 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
            font-size: 16px;
        }
        .content {
            padding: 40px;
        }
        .history-section {
            margin-bottom: 30px;
        }
        .history-section h2 {
            color: #1a3a6b;
            font-size: 20px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3182ce;
        }
        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .report-card {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
        }
        .report-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border-color: #3182ce;
        }
        .report-card .date {
            font-size: 18px;
            font-weight: bold;
            color: #1a3a6b;
            margin-bottom: 8px;
        }
        .report-card .desc {
            font-size: 14px;
            color: #4a5568;
        }
        .report-card.today {
            background: linear-gradient(135deg, #3182ce 0%, #2c5282 100%);
            color: white;
        }
        .report-card.today .date,
        .report-card.today .desc {
            color: white;
        }
        .info-box {
            background: #ebf8ff;
            border-left: 4px solid #3182ce;
            padding: 16px;
            border-radius: 0 8px 8px 0;
            margin-top: 20px;
        }
        .info-box p {
            color: #2c5282;
            font-size: 14px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #3182ce;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 信用评级招标公告日报</h1>
            <p>每日自动更新 · 历史报告查看</p>
        </div>
        <div class="content">
            <div class="history-section">
                <h2>📅 历史报告 (最近30天)</h2>
                <div class="report-grid">
                    <a href="credit-rating-bid-report-20260413.html" class="report-card today">
                        <div class="date">📌 4月13日</div>
                        <div class="desc">今日最新报告</div>
                    </a>
                    <a href="credit-rating-bid-report-20260410.html" class="report-card">
                        <div class="date">📅 4月10日</div>
                        <div class="desc">查看历史报告</div>
                    </a>
                    <a href="credit-rating-bid-report-20260409.html" class="report-card">
                        <div class="date">📅 4月9日</div>
                        <div class="desc">查看历史报告</div>
                    </a>
                </div>
            </div>
            
            <div class="info-box">
                <p><strong>💡 使用说明：</strong></p>
                <p>• 点击上方卡片可查看对应日期的完整报告</p>
                <p>• 报告每日自动更新，包含当日新发布公告、近期进行中公告和已成交公示</p>
                <p>• 历史报告保留最近30天数据</p>
            </div>
        </div>
    </div>
</body>
</html>
